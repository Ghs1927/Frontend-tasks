<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model Task</h1>
    <p class="intro">Building simple cards using the CSS Box Model.</p>

    <div class="container">

        <div class="traffic-card">
            <div class="traffic-light">

                <div class="light red">
                    <p>STOP<br>PROCRASTINATING</p>
                </div>

                <div class="light yellow">
                    <p>GET READY<br>TO LEARN</p>
                </div>

                <div class="light green">
                    <p>START<br>YOUR<br>JOURNEY</p>
                </div>

            </div>

            <div class="stick"></div>

            <h2>FULLSTACK EXPERTS<br>ACADEMY</h2>
            <p>Learn • Build • Grow 🚀</p>
        </div>


        <div class="movie-card">

            <img src="https://www.hollywoodreporter.com/wp-content/uploads/2015/07/shivudu_first_look.jpg" alt="Movie Poster">

            <div class="movie-info">
                <h2>Baahubali</h2>
                <p>Rating : 4.5/5 ⭐</p>
            </div>

        </div>

    </div>

</body>
</html>
