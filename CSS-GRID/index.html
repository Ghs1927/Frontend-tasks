<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
        }    
        .container{
            height:600px;
            width:1000px;
            margin:0px auto;
            margin-top:30px;
            display:grid;
            grid-template-columns:200px 200px 200px 400px;
            grid-template-rows:100px 200px 200px 100px;
            gap:10px;
        }
        .box{
            border:2px solid black;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:4px;
            border:none;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight:600;
            color:white;
        }
        .box1{
            background-color:rgb(72, 72, 249);
            grid-column:1/5;
        }
        .box2{
            background-color:rgb(28, 173, 125);
            grid-column:1/3;
        }
        .box3{
            background-color: rgb(212, 57, 57);;
        }
        .box4{
            background-color:blueviolet;
            grid-row:2/4;
            grid-column:4/5;
        }
        .box5{
            background-color:rgb(251, 119, 251);
        }
        .box6{
            background-color: gold;
        }
        .box7{
            background-color: crimson;
        }
        .box8{
            background-color:rgb(72, 72, 249);
            grid-column:1/5;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Headline</div>
        <div class="box box2">News 1</div>
        <div class="box box3">News 2</div>
        <div class=" box box4">Advertisements</div>
        <div class=" box box5">News3</div>
        <div class="box box6">News 4</div>
        <div class="box box7">News 5</div>
        <div class=" box box8">Footer</div>
    </div>
    
</body>
</html>
