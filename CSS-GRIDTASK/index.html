<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="grid-container">

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-1">
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box orange"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-2">
                <div class="box coral span-top-left"></div>
                <div class="box orange span-right"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-3">
                <div class="box orange span-row-1"></div>
                <div class="box teal"></div>
                <div class="box coral"></div>
                <div class="box teal span-row-3"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-4">
                <div class="box orange top"></div>
                <div class="box coral top1"></div>
                <div class="box teal "></div>
                <div class="box teal second"></div>
                <div class="box orange span-bottom"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-5">
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box teal"></div>
                <div class="box orange"></div>
                <div class="box orange"></div>
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box coral"></div>
                <div class="box teal"></div>
                <div class="box coral"></div>
                <div class="box teal"></div>
                <div class="box orange"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-6">
                <div class="box coral span-w3"></div>
                <div class="box orange span-h3"></div>
                <div class="box coral"></div>
                <div class="box teal span-w3"></div>
                <div class="box orange span-w3"></div>
                <div class="box teal span-w3"></div>
                <div class="box orange"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots"><span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-7">
                <div class="box orange"></div>
                <div class="box teal"></div>
                <div class="box coral span-left-col"></div>
                <div class="grid-7-sub">
                    <div class="box teal span-sub-top"></div>
                    <div class="box teal"></div>
                    <div class="box orange"></div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-8">
                <div class="box orange "></div>
                <div class="box coral"></div>
                <div class="box orange"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
                <div class="box teal"></div>
                <div class="box orange"></div>
                <div class="box coral right"></div>
                <div class="box teal span-all-cols"></div>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="search-bar"></div>
            </div>
            <div class="content-grid grid-9">
                <div class="box orange span-top-row"></div>
                <div class="box teal span-left-hero"></div>
                <div class="grid-9-sub">
                    <div class="box teal span-full-width"></div>
                    <div class="box coral"></div>
                    <div class="box orange"></div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
