<h1>JavaScript Pattern Programs</h1>

<h2>Pattern 1</h2>
<script>
for(let i=1;i<=5;i++){
    let output=""
    for(let j=1;j<=5;j++){
        if(j==3||i==3){
            output+="*"
        }
        else{
            output+=j
        }
    }
    document.write(output+"<br>")
}
</script>

<h2>Pattern 2</h2>
<script>
for(let i=1;i<=5;i++){

            output+="*"
        }
        else{
            output+=j
        }
    }
    document.write(output+"<br>")
}
</script>

<h2>Pattern 4</h2>
<script>

<script>

<h2>Pattern 9</h2>
<script>
for(let i=1;i<=5;i++){

    }

}
</script>
